---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: instance-el8
    image: rockylinux:8
    privileged: true
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    command: "/usr/sbin/init"
    pre_build_image: true
    cgroupns_mode: host

provisioner:
  playbooks:
    prepare: prepare.yml
  name: ansible
verifier:

  name: ansible
