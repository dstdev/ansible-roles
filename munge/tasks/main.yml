---
# tasks file for munge
#
- name: Gather os specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ansible_os_family}}.yaml"
        - "{{ansible_os_family}}-{{ansible_distribution_major_version}}.yaml"
      paths:
        - "{{ role_path }}/vars"
  tags:
    - munge

# --- Custom repo setup (when munge_custom_repo_url is set) ---
- name: Configure custom munge RPM repository
  ansible.builtin.yum_repository:
    name: "{{ munge_custom_repo_name }}"
    description: "{{ munge_custom_repo_description }}"
    baseurl: "{{ munge_custom_repo_url }}"
    gpgcheck: "{{ munge_custom_repo_gpgcheck }}"
    gpgkey: "{{ munge_custom_repo_gpgkey | default(omit, true) }}"
    enabled: true
  when: munge_custom_repo_url != ""
  tags:
    - munge

# --- Default path: install from EPEL ---
- name: Install munge bootstrap packages (EPEL)
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ munge_bootstrap_packages }}"
  when: munge_custom_repo_url == ""
  tags:
    - munge

- name: Install munge-devel for EL8+ (powertools/crb)
  ansible.builtin.dnf:
    name: munge-devel
    enablerepo: "{{ munge_el_repo }}"
    state: present
  when:
    - munge_custom_repo_url == ""
    - ansible_os_family == 'RedHat'
    - ansible_distribution_major_version | int >= 8
  tags:
    - munge

- name: Install munge packages (default repos)
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ munge_install_packages }}"
  when: munge_custom_repo_url == ""
  tags:
    - munge

# --- Custom repo path: install from custom repo ---
- name: Install munge packages (custom repo)
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
    enablerepo: "{{ munge_custom_repo_name }}"
  loop: "{{ munge_install_packages }}"
  when: munge_custom_repo_url != ""
  tags:
    - munge

- name: create munge keyfile
  ansible.builtin.copy:
    dest: "/etc/munge/munge.key"
    content: "{{munge_key}}"
    owner: "{{munge_user}}"
    mode: "0400"
  notify:
    - Restart munge
  tags:
    - munge

- name: Fix munge file if needed
  ansible.builtin.lineinfile:
    backup: true
    path: /lib/systemd/system/munge.service
    state: present
    insertafter: "\\[Install\\]"
    regexp: "^WantedBy=multi-user.target"
    line: "WantedBy=multi-user.target"
  notify:
    - Reload munge
    - Restart munge
  tags:
    - munge

- name: Start munge service
  ansible.builtin.service:
    name: munge
    state: started
    enabled: true
  when: not ansible_is_chroot
  tags:
    - munge

- name: Enable munge on image
  ansible.builtin.shell: systemctl enable munge
  when: ansible_is_chroot
  tags:
    - munge
