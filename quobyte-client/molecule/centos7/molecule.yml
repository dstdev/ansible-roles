---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: instance
    image: centos:7
    privileged: true
    volume_mounts:
      - "sys/fs/cgroup:/sys/fs/cgroup:ro"
    command: "/usr/sbin/init"
    pre_build_image: true
provisioner:
  playbooks:
    prepare: prepare.yml
  name: ansible
verifier:

  name: ansible
