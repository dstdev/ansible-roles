---

- name: Gather os specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_os_family }}.yaml"
        - "{{ ansible_os_family }}-{{ ansible_distribution_major_version }}\
           .yaml"
      paths:
        - "{{ role_path }}/vars"
  tags:
    - always

##################################################
# Exits role after the rpmbuildI(s) are complete.
- name: Build RPM packages if needed 
  ansible.builtin.include_tasks: "rpmbuild.yaml"
  when: slurm_build_rpms
# role exits early if slurm_build_rpms == true 
##################################################

- name: Include pre-install tasks
  ansible.builtin.include_tasks: "pre_install.yaml"
  tags:
    - always

- name: Check if Slurm Version is above 24.05.8-0
  ansible.builtin.include_tasks: "slurm_version_check.yaml"
  tags:
    - always

- name: Include rpm install tasks
  ansible.builtin.include_tasks: "rpm_install.yaml"
  tags:
    - always

- name: Include post-install tasks
  ansible.builtin.include_tasks: "post_install.yaml"
  tags:
    - always

- name: Include firewall tasks
  ansible.builtin.include_tasks: "firewall.yaml"
  tags:
    - always

- name: Include slurmdbd tasks
  ansible.builtin.include_tasks: "slurmdbd.yaml"
  when: slurm_controller
  tags:
    - always

- name: Include slurmctld tasks
  ansible.builtin.include_tasks: "slurmctld.yaml"
  when: slurm_controller
  tags:
    - always

- name: Include slurmrestd tasks
  ansible.builtin.include_tasks: "slurmrestd.yaml"
  when: slurm_controller and slurm_enable_restd
  tags:
    - always
    
- name: Include slurmd tasks
  ansible.builtin.include_tasks: "slurmd.yaml"
  when: slurm_slurmd
  tags:
    - always
    
- name: Include cleaup tasks
  ansible.builtin.include_tasks: "cleanup.yaml"
  tags:
    - always
