- name: Install slurm rpm packages 
  yum:
    state: present
    name:
      - slurm
      - slurm-perlapi
      - slurm-libpmi
  tags: 
    - slurm
    - slurm_install_controller
    - slurm_install_slurmd

- name: Install slurm controller rpm packages
  yum:
    state: present
    name:
      - slurm-slurmctld
      - slurm-slurmdbd
  when: slurm_controller
  tags: 
    - slurm
    - slurm_install_controller

- name: Install slurmd rpm packages
  yum:
    state: present
    name:
      - slurm-slurmd
      - slurm-pam_slurm
  when: slurm_slurmd
  tags:
    - slurm
    - slurm_install_slurmd

- name: Install slurmrestd rpm packages
  yum:
    state: present
    name:
      - slurm-slurmrestd
  when: slurm_controller and slurm_enable_restd 
  tags:
    - slurm
    - slurm_install_controller
    - slurm_install_restd


